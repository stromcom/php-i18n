name: Code Analysis

on:
  workflow_dispatch:
  push:
  workflow_call:

jobs:
  phpstan:
    name: PHPStan (level 8)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, xsl, intl, mbstring, mysqli, openssl, sodium
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --optimize-autoloader

      - name: Static analysis (PHPStan level 8)
        run: composer stan

  tests:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, xsl, intl, mbstring, mysqli, openssl, sodium
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --optimize-autoloader

      - name: Run unit tests
        run: composer test

  mutation:
    name: Infection (mutation testing)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, xsl, intl, mbstring, mysqli, openssl, sodium
          # Infection needs a coverage driver; pcov is far faster than xdebug here.
          coverage: pcov

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --optimize-autoloader

      # Gates the quality of the code that IS covered — it does not demand that the
      # untested classes grow tests. Raise the threshold as coverage expands.
      - name: Mutation testing
        run: composer mutate -- --min-covered-msi=75 --no-progress

      - name: Upload Infection report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: infection-log
          path: infection.log
          if-no-files-found: ignore